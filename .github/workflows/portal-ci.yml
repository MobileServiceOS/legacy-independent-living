name: portal-ci

on:
  push:
    branches: [portal-app]
  pull_request:
    branches: [portal-app]
  workflow_dispatch:

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy
          POSTGRES_DB: legacy_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U legacy" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://legacy:legacy@localhost:5432/legacy_dev
      TEST_DATABASE_ADMIN_URL: postgresql://legacy:legacy@localhost:5432/postgres
      APP_URL: http://localhost:3000
      PAYMENTS_PROVIDER: mock
      CRON_SECRET: ci-secret
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p ci-logs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Upload lockfile (for committing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Schema drift check (schema.prisma ↔ database)
        run: |
          npm run db:check
          psql "$TEST_DATABASE_ADMIN_URL" -c "CREATE DATABASE legacy_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url postgresql://legacy:legacy@localhost:5432/legacy_shadow --exit-code > prisma-diff.txt || (echo "::warning::Prisma reports differences (expected only for raw-SQL rules):" && cat prisma-diff.txt)
        env:
          PGPASSWORD: legacy
      - name: Typecheck
        id: typecheck
        run: npm run typecheck 2>&1 | tee ci-logs/typecheck.log
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee ci-logs/lint.log
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: npm run test:unit 2>&1 | tee ci-logs/unit-tests.log
      - name: Database integrity tests
        id: db
        continue-on-error: true
        run: npm run test:db 2>&1 | tee ci-logs/database-integrity-tests.log
      - name: Integration tests
        id: integration
        continue-on-error: true
        run: npm run test:integration 2>&1 | tee ci-logs/integration-tests.log
      - name: Build
        id: build
        run: npm run build 2>&1 | tee ci-logs/build.log
      - name: Seed smoke test
        id: seed
        run: npx prisma migrate reset --force 2>&1 | tee ci-logs/seed-smoke-test.log
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        id: e2e
        run: npm run test:e2e 2>&1 | tee ci-logs/end-to-end-tests.log
        env:
          CI: "true"
      - name: Annotate failures
        if: always()
        run: |
          files=""
          add() { [ "$1" = "failure" ] && files="$files ci-logs/$2.log" || true; }
          add "${{ steps.typecheck.outcome }}" typecheck
          add "${{ steps.lint.outcome }}" lint
          add "${{ steps.unit.outcome }}" unit-tests
          add "${{ steps.db.outcome }}" database-integrity-tests
          add "${{ steps.integration.outcome }}" integration-tests
          add "${{ steps.build.outcome }}" build
          add "${{ steps.seed.outcome }}" seed-smoke-test
          add "${{ steps.e2e.outcome }}" end-to-end-tests
          [ -n "$files" ] && node scripts/ci-annotate.mjs $files || echo "no failures"
      - name: Fail if any check failed
        if: steps.lint.outcome == 'failure' || steps.unit.outcome == 'failure' || steps.db.outcome == 'failure' || steps.integration.outcome == 'failure'
        run: exit 1
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
