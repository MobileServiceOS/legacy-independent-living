name: portal-ci

on:
  push:
    branches: [portal-app]
  pull_request:
    branches: [portal-app]
  workflow_dispatch:

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: legacy
          POSTGRES_PASSWORD: legacy
          POSTGRES_DB: legacy_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U legacy" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://legacy:legacy@localhost:5432/legacy_dev
      TEST_DATABASE_ADMIN_URL: postgresql://legacy:legacy@localhost:5432/postgres
      APP_URL: http://localhost:3000
      PAYMENTS_PROVIDER: mock
      CRON_SECRET: ci-secret
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Upload lockfile (for committing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Schema drift check (schema.prisma ↔ database)
        run: |
          npm run db:check
          psql "$TEST_DATABASE_ADMIN_URL" -c "CREATE DATABASE legacy_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url postgresql://legacy:legacy@localhost:5432/legacy_shadow --exit-code > prisma-diff.txt || (echo "::warning::Prisma reports differences (expected only for raw-SQL rules):" && cat prisma-diff.txt)
        env:
          PGPASSWORD: legacy
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Database integrity tests
        run: npm run test:db
      - name: Integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: Seed smoke test
        run: npx prisma migrate reset --force
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
